name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Detect changed slides
        id: changes
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            changed=$(git diff --name-only HEAD~1 HEAD -- slides/ themes/ | grep -oP 'slides/\K[^/]+' | sort -u || true)
          else
            changed=""
          fi
          # workflow_dispatch or first commit → build all
          if [ -z "$changed" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed=$(ls -1 slides/)
          fi
          echo "slides<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed slides: $changed"

      - name: Restore previous build
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: slides-dist-${{ github.sha }}
          restore-keys: slides-dist-

      - name: Build changed slides
        run: |
          mkdir -p dist
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            echo "Building $name..."
            pnpm --filter "$name" build --base /${{github.event.repository.name}}/$name/
            rm -rf "dist/$name"
            mv "slides/$name/dist" "dist/$name"
            cp "dist/$name/index.html" "dist/$name/404.html"
          done <<< "${{ steps.changes.outputs.slides }}"

      - name: Save build cache
        uses: actions/cache/save@v4
        with:
          path: dist
          key: slides-dist-${{ github.sha }}

      - name: Create index page
        run: |
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Talks</title></head><body><h1>Talks</h1><ul>' > dist/index.html
          for dir in dist/*/; do
            name=$(basename "$dir")
            echo "<li><a href=\"$name/\">$name</a></li>" >> dist/index.html
          done
          echo '</ul></body></html>' >> dist/index.html

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
